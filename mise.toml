# Kirily toolchain（ローカル・CI・worktree で同一にする）
[tools]
node = "26.8.1"
bun = "1.4.0"
rust = { version = "1.98.0", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }

[env]
# Homebrew の古い lefthook が PATH の先にいることがある。git hook は
# package.json で固定したバージョンを使う（全環境で同じ挙動にするため）。
LEFTHOOK_BIN = "{{config_root}}/node_modules/lefthook-darwin-arm64/bin/lefthook"

[settings]
experimental = true
