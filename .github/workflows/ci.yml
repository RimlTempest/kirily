name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: 不変条件の検査
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: 画像をサーバーに置くバインディングを足していないこと (ADR-0004)
        run: |
          # R2 / KV / D1 を足すということは、画像か、画像にまつわる何かを
          # サーバーへ置くということ。トップページの約束が変わるので、
          # ADR なしには通さない。
          if grep -qE '^\s*"(r2_buckets|kv_namespaces|d1_databases)"\s*:' apps/web/wrangler.jsonc; then
            echo "::error file=apps/web/wrangler.jsonc::Storage bindings change the privacy promise. Write an ADR first (ADR-0004)."
            exit 1
          fi

      - name: Preview を書き出しに使っていないこと (Rule 2)
        run: |
          # エディタの Canvas から直接エンコードすると、元解像度が失われる。
          hits=$(grep -rnE '\b(toDataURL|toBlob)\s*\(' apps/web/src --include='*.ts' --include='*.svelte' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Export must start from the original pixels in export.ts, not from a preview canvas."
            exit 1
          fi

      - name: モデルの重みがサイズとハッシュで固定されていること (ADR-0007)
        run: |
          # 上流が差し替わっても気づけないと、コードを変えていないのに
          # 出力だけ変わる。取得元は必ず bytes と sha256 で固定する。
          ids=$(grep -cE "^\s+id: '" tools/fetch-models.ts)
          hashes=$(grep -cE "^\s+sha256: '[0-9a-f]{64}'," tools/fetch-models.ts)
          if [ "$ids" != "$hashes" ]; then
            echo "::error file=tools/fetch-models.ts::Every model needs a pinned 64-char sha256 ($ids models, $hashes hashes)."
            exit 1
          fi

      - name: ピクセル処理 crate が wasm-bindgen に依存していないこと
        run: |
          for f in crates/kirily-image/Cargo.toml crates/kirily-mask/Cargo.toml crates/kirily-raster/Cargo.toml; do
            if grep -qE '^\s*wasm-bindgen' "$f"; then
              echo "::error file=$f::Pixel crates must stay runnable under plain 'cargo test'. Keep wasm-bindgen in crates/kirily-wasm."
              exit 1
            fi
          done

  # ドメイン層に DOM が漏れていないことは、ここの oxlint
  # （kirily/no-dom-in-core）が見る。grep では `const window = ...` のような
  # ローカル変数もコメント中の語も区別できず、実際に誤検知した。
  fmt-lint:
    name: fmt + lint (oxfmt / oxlint / prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint

  rust:
    name: rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: ブラウザ向け wasm がビルドできること
        run: cargo check -p kirily-wasm --target wasm32-unknown-unknown

  typecheck-test:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen が生成する .d.ts は型検査の入力。git 管理外なのでここで作る。
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
      - run: bun run wasm:build
      - run: bun run typecheck
      - run: bun run test

  e2e:
    name: e2e (desktop + mobile)
    runs-on: ubuntu-latest
    # wasm-pack のビルド、284 MiB のモデル取得、ブラウザの用意が入るので長い。
    # 既定の 6 時間のままハングさせると private リポジトリの Actions 時間を
    # 丸ごと食うので、上限を置く。固まりやすい step には個別の上限も置いた。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with: { cache: true }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
      - run: bun run wasm:build
      # 重みは git 管理外。E2E はモデルが無ければその検証を skip するが、
      # ここでは実際に取りにいって本物のモデルで回す。
      - name: セグメンテーションモデルを取得
        run: bun run models:fetch
      - run: bun run build
      - name: 静的アセットが Cloudflare の 25 MiB 上限に収まること (ADR-0007)
        run: bun run tools/check-asset-sizes.ts
      - name: ブラウザ向け wasm のサイズ上限
        run: |
          # 初期表示で読むものなので、gzip 300KB を超えたら設計を見直す。
          size=$(find packages/wasm/pkg -name '*.wasm' -exec gzip -c {} + | wc -c)
          echo "browser wasm: ${size} bytes gzip"
          if [ "$size" -eq 0 ]; then
            echo "::error::No wasm artifact found. Check the wasm-pack out-name."
            exit 1
          fi
          if [ "$size" -gt 307200 ]; then
            echo "::error::Browser wasm exceeded 300KB gzip."
            exit 1
          fi
      # `--with-deps` は apt を呼ぶ。フロントエンドを明示しないと
      # 設定プロンプトで待ち続け、ジョブが固まる。
      - name: Playwright のブラウザを用意
        run: bun run e2e:install
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 10
      # ランナーに GPU アダプタが無いので CPU 段（U²-Netp）が走る。
      # WebGPU 段は実機で `bun run e2e:webgpu`（ADR-0007）。
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
